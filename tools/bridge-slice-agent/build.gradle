plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
}
repositories { mavenCentral() }
dependencies { implementation 'org.ow2.asm:asm:9.9' }
sourceSets {
    drain {
        compileClasspath += sourceSets.main.output
    }
    drainTest
    dispatch { compileClasspath += sourceSets.main.output + configurations.runtimeClasspath }
    dispatchTest { compileClasspath += sourceSets.main.output + sourceSets.dispatch.output + sourceSets.drainTest.output }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
tasks.named('test') { enabled = false }
tasks.register('bootstrapJar', Jar) {
    dependsOn classes
    archiveFileName = 'bridge-slice-bootstrap.jar'
    from(sourceSets.main.output) {
        include 'org/marshal/wesotest/slices/CallEvent.class', 'org/marshal/wesotest/slices/SliceProbe*.class'
    }
}
shadowJar {
    archiveFileName = 'bridge-slice-agent.jar'
    manifest { attributes 'Premain-Class': 'org.marshal.wesotest.slices.SliceAgent' }
    relocate 'org.objectweb.asm', 'org.marshal.wesotest.slices.internal.asm'
    from('../test-desktop/agent/src/main/resources') { include 'META-INF/ASM-LICENSE.txt' }
    exclude 'module-info.class'
    exclude 'org/marshal/wesotest/slices/CallEvent.class', 'org/marshal/wesotest/slices/SliceProbe*.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('drainAgentJar', Jar) {
    dependsOn drainClasses, shadowJar, bootstrapJar
    archiveFileName = 'bridge-drain-agent.jar'
    manifest { attributes 'Premain-Class': 'org.marshal.wesotest.slices.DrainAgent' }
    from(sourceSets.drain.output)
    from({ zipTree(shadowJar.archiveFile.get().asFile) }) { exclude 'META-INF/MANIFEST.MF' }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.register('verifyAgentJar') {
    dependsOn shadowJar, bootstrapJar, drainAgentJar
    doLast {
        new java.util.zip.ZipFile(shadowJar.archiveFile.get().asFile).withCloseable { zip ->
            if (zip.entries().find { it.name.startsWith('org/objectweb/asm/') })
                throw new GradleException('Diagnostic agent exports unrelocated ASM')
            for (def name : ['META-INF/ASM-LICENSE.txt', 'org/marshal/wesotest/slices/SliceAgent.class'])
                if (!zip.getEntry(name)) throw new GradleException("Missing diagnostic resource: ${name}")
        }
        new java.util.zip.ZipFile(tasks.bootstrapJar.archiveFile.get().asFile).withCloseable { zip ->
            if (!zip.getEntry('org/marshal/wesotest/slices/CallEvent.class') || zip.entries().find { it.name.contains('/asm/') })
                throw new GradleException('Invalid bootstrap helper isolation')
        }
        new java.util.zip.ZipFile(tasks.drainAgentJar.archiveFile.get().asFile).withCloseable { zip ->
            if (!zip.getEntry('org/marshal/wesotest/slices/DrainAgent.class')
                    || zip.entries().find { it.name.startsWith('org/marshal/weaddon_lightposition/') || it.name.endsWith('Checks.class') })
                throw new GradleException('Drain agent contains a production/test subject or lacks its entrypoint')
        }
    }
}
tasks.register('verifyProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.marshal.wesotest.slices.SliceAgentChecks'
    args layout.buildDirectory.file('probe.jfr').get().asFile.absolutePath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(providers.gradleProperty('testJavaVersion').getOrElse('21').toInteger())
    }
    maxHeapSize = '256m'
    jvmArgs '-XX:ActiveProcessorCount=2'
}
tasks.register('verifyBootstrapProbe', JavaExec) {
    dependsOn testClasses, verifyAgentJar
    classpath = sourceSets.test.output + files(shadowJar)
    mainClass = 'org.marshal.wesotest.slices.SliceAgentChecks'
    args layout.buildDirectory.file('bootstrap-probe.jfr').get().asFile.absolutePath
    javaLauncher = tasks.verifyProbe.javaLauncher
    maxHeapSize = '256m'
    jvmArgs '-XX:ActiveProcessorCount=2', '-Dweso.bridge.fixture=true', '-Dweso.bridge.sliceDiagnostics=true',
            "-javaagent:${shadowJar.archiveFile.get().asFile.absolutePath}"
}
check.dependsOn verifyAgentJar, verifyProbe, verifyBootstrapProbe

tasks.register('verifyDrainProbe', JavaExec) {
    dependsOn drainTestClasses, verifyAgentJar
    classpath = sourceSets.drainTest.runtimeClasspath
    mainClass = 'org.marshal.wesotest.slices.DrainAgentChecks'
    args layout.buildDirectory.file('drain-probe.jfr').get().asFile.absolutePath
    javaLauncher = tasks.verifyProbe.javaLauncher
    maxHeapSize = '256m'
    jvmArgs '-XX:ActiveProcessorCount=2', '-Dweso.bridge.fixture=true', '-Dweso.bridge.sliceDiagnostics=true',
            '-Dweso.bridge.drainDiagnostics=true', "-javaagent:${tasks.drainAgentJar.archiveFile.get().asFile.absolutePath}"
}
check.dependsOn verifyDrainProbe

tasks.named('compileDispatchJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
    options.release = 25
}
tasks.named('compileDispatchTestJava', JavaCompile) {
    dependsOn drainTestClasses
    javaCompiler = tasks.compileDispatchJava.javaCompiler
    options.release = 25
}
tasks.register('dispatchBootstrapJar', Jar) {
    dependsOn dispatchClasses
    archiveFileName = 'bridge-dispatch-bootstrap.jar'
    from(sourceSets.dispatch.output) { exclude '**/DispatchAgent*.class' }
}
tasks.register('dispatchAgentJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    dependsOn dispatchClasses, shadowJar, bootstrapJar, dispatchBootstrapJar
    archiveFileName = 'bridge-dispatch-agent.jar'
    configurations = []
    relocate 'org.objectweb.asm', 'org.marshal.wesotest.slices.internal.asm'
    manifest { attributes 'Premain-Class': 'org.marshal.wesotest.slices.DispatchAgent' }
    from(sourceSets.dispatch.output) { include '**/DispatchAgent*.class' }
    from({ zipTree(shadowJar.archiveFile.get().asFile) }) { exclude 'META-INF/MANIFEST.MF' }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.register('verifyDispatchProbe', JavaExec) {
    dependsOn dispatchTestClasses, dispatchAgentJar
    classpath = sourceSets.dispatchTest.output + sourceSets.drainTest.output
    mainClass = 'org.marshal.wesotest.slices.DispatchChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    args layout.buildDirectory.file('dispatch-probe.jfr').get().asFile.absolutePath
    maxHeapSize = '256m'
    jvmArgs '-XX:ActiveProcessorCount=2', '--enable-native-access=ALL-UNNAMED',
            '-Dweso.bridge.fixture=true', '-Dweso.bridge.sliceDiagnostics=true', '-Dweso.bridge.dispatchDiagnostics=true',
            "-javaagent:${tasks.dispatchAgentJar.archiveFile.get().asFile.absolutePath}"
}
tasks.register('probeSamplerCause', JavaExec) {
    dependsOn dispatchTestClasses, dispatchBootstrapJar, bootstrapJar
    classpath = sourceSets.dispatchTest.output + files(tasks.dispatchBootstrapJar, tasks.bootstrapJar)
    mainClass = 'org.marshal.wesotest.slices.SamplerCauseProbe'
    javaLauncher = tasks.verifyDispatchProbe.javaLauncher
    args rootProject.file('../../build/bridge-sampler-cause-20261017').absolutePath
    maxHeapSize = '256m'
    jvmArgs '-XX:ActiveProcessorCount=2', '--enable-native-access=ALL-UNNAMED',
            '-Dweso.bridge.fixture=true', '-Dweso.bridge.dispatchDiagnostics=true'
}
