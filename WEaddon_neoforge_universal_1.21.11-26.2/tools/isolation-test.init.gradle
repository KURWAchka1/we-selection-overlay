allprojects {
    afterEvaluate {
        def tests = sourceSets.create('isolationTest') {
            java.srcDir(neo_version.startsWith('21.') ? 'tools/isolation-test/mc1_21_11' : (neo_version.startsWith('26.2') ? 'tools/isolation-test/java' : 'tools/isolation-test/mc26_1'))
            resources.srcDir('tools/isolation-test/resources')
            compileClasspath += sourceSets.main.compileClasspath
        }
        neoForge.addModdingDependenciesTo(tests)
        tasks.named('compileIsolationTestJava') { options.release = neo_version.startsWith('21.') ? 21 : 25 }
        def testJar = tasks.register('isolationTestJar', Jar) {
            from(tests.output)
            archiveClassifier = 'isolation-test-only'
        }
        neoForge.runs.create('isolationClient') {
            client()
            gameDirectory = file('run-isolation-test-' + (neo_version.startsWith('21.') ? '1.21.11' : (neo_version.startsWith('26.2') ? '26.2' : '26.1')))
            programArguments.addAll('--quickPlaySingleplayer', 'weso-fixture', '--width', '1024', '--height', '640')
            jvmArguments.add('-Xmx2G')
        }
        dependencies.add('runtimeOnly', files(testJar))
    }
}
