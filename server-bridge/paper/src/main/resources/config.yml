# Conservative transport admission defaults, not measured performance guarantees.
# No preview workers or subscriptions. One owning-thread dispatch task exists
# only while a bounded queue is nonempty; decoding/reads share the global budget.
limits:
  max-connections: 1024
  global-requests-per-second: 100
  global-burst: 100
  player-requests-per-second: 4
  player-burst: 8
