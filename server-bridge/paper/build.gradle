repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
}

dependencies {
    implementation project(':core')
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.4.2'
}

sourceSets.main.java {
    srcDir rootProject.file('../shared/selection-editing/src/main/java')
    include 'org/marshal/weaddon_lightposition/bridge/paper/**',
            'org/marshal/weaddon_lightposition/selection/CuboidDraft.java',
            'org/marshal/weaddon_lightposition/selection/SelectionEditSnapshot.java',
            'org/marshal/weaddon_lightposition/selection/worldedit/SelectionEditTransaction.java'
}

tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') { expand(version: project.version) }
}

tasks.named('jar') {
    dependsOn ':core:classes', ':protocol:classes'
    archiveBaseName = 'worldedit_selection_overlay-bridge-paper'
    from project(':core').sourceSets.main.output
    from project(':protocol').sourceSets.main.output
    from(rootProject.file('../LICENSE'))
}
