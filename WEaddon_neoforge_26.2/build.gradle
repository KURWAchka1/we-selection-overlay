plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
    exclude("fabric.mod.json")
}

base {
    archivesName = mod_id
}

repositories {
    maven {
        name = "EngineHub"
        url = "https://maven.enginehub.org/repo/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    jarJar(implementation("org.enginehub.worldeditcui-protocol:worldeditcui-protocol-neoforge-mc26.2:4.0.3")) {
        version {
            strictly "[4.0.3,4.1.0)"
            prefer "4.0.3"
        }
    }
    compileOnly "org.enginehub.worldeditcui-protocol:worldeditcui-protocol-common-mc26.2:4.0.3:dev"
    compileOnly "maven.modrinth:worldedit:7.4.5"
    localRuntime "maven.modrinth:worldedit:7.4.5"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def artifactFileName = "${mod_id}-${mod_version}.jar"
def archivedArtifactFileName = "${mod_id}-${mod_version}-neoforge-${minecraft_version}.jar"
def versionedLibsDir = layout.projectDirectory.dir("libs/${mod_version}")

tasks.register("archiveVersionArtifacts", Copy) {
    dependsOn(tasks.named("jar"))

    from(layout.buildDirectory.dir("libs")) {
        include artifactFileName
        rename { archivedArtifactFileName }
    }

    into(versionedLibsDir)
}

tasks.named("build") {
    finalizedBy(tasks.named("archiveVersionArtifacts"))
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

sourceSets.main.java.srcDir('../shared/command-preview/src/main/java')

sourceSets.main.java.srcDir('../shared/neoforge-cui/src/main/java')
